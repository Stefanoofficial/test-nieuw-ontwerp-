<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f8f62">
<title>Mijn Geheugen</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f4f7f4;--card:#fff;--text:#173126;--muted:#6f7d76;--line:#dfe8e2;--green:#2f8f62;--green2:#dff3e8;--danger:#c94c4c;--shadow:0 8px 24px #18352a12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:82px}
header{padding:22px 18px 10px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:22px}.avatar{width:40px;height:40px;border-radius:50%;background:var(--green2);display:grid;place-items:center}
main{padding:8px 16px}.search{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}.search input{border:0;outline:0;background:transparent;width:100%}
h1{font-size:28px;margin:10px 0 4px}.sub{color:var(--muted);margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.cat{padding:12px 5px;border:1px solid var(--line);background:var(--card);border-radius:15px;text-align:center}.cat b{display:block;font-size:12px;margin-top:7px}.ico{font-size:23px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}.row{display:flex;align-items:center;gap:12px}.grow{flex:1}.muted{color:var(--muted)}.pill{background:var(--green2);color:#17633f;padding:5px 9px;border-radius:99px;font-size:12px}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.thumb{width:48px;height:48px;border-radius:13px;background:#eef6f0;display:grid;place-items:center;font-size:25px}.check{width:22px;height:22px}
.primary{width:100%;padding:13px 16px;border-radius:14px;background:var(--green);color:white;font-weight:750}.secondary{padding:11px 14px;border-radius:12px;background:var(--green2);color:#17633f;font-weight:700}
.fab{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;background:var(--green);color:white;font-size:28px;box-shadow:0 10px 25px #18352a33}.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center}.navin{max-width:520px;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{background:transparent;color:var(--muted);padding:12px 3px 10px}.nav button.active{color:var(--green);font-weight:800}.nav span{display:block;font-size:11px;margin-top:3px}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kpi .card{margin:0}.big{font-size:25px;font-weight:800}.empty{text-align:center;padding:35px 15px;color:var(--muted)}
.modal{position:fixed;inset:0;background:#10241c88;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{background:var(--card);width:100%;max-width:520px;margin:auto;border-radius:24px 24px 0 0;padding:20px;max-height:88vh;overflow:auto}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);outline:none}.top{display:flex;justify-content:space-between;align-items:center}.close{background:var(--bg);border-radius:50%;width:38px;height:38px}.menu button{display:flex;width:100%;padding:15px 5px;background:transparent;border-bottom:1px solid var(--line);text-align:left}.menu button span{width:32px}.tag{font-size:11px;color:var(--muted)}
body.dark{--bg:#111814;--card:#1c2621;--text:#e8f1eb;--muted:#a7b5ad;--line:#334239;--green2:#254b37;--shadow:0 8px 24px #0005}.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#173126;color:#fff;padding:10px 14px;border-radius:12px;display:none;z-index:50}
.login{min-height:100vh;display:grid;place-items:center;padding:25px}.loginbox{max-width:420px;width:100%;text-align:center}.logo{font-size:60px}.loginbox .card{text-align:left}
@media(min-width:700px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>
<div id="root"></div><div id="toast" class="toast"></div>
<script>
const KEY='mijnGeheugenDemo';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{
 logged:false,user:{name:'Jeroen',email:'jij@example.com'},dark:false,tab:'home',
 items:[
 {id:1,name:'Wasmachine',cat:'Apparaten',icon:'🧺',location:'Keuken',date:'2025-03-14',notes:'Bosch Serie 6. Filter elke 6 maanden vervangen.',reminder:'2026-11-12'},
 {id:2,name:'Auto',cat:'Auto',icon:'🚗',location:'Garage',date:'2025-05-02',notes:'APK en onderhoud.',reminder:'2026-12-18'},
 {id:3,name:'Verf slaapkamer',cat:'Huis',icon:'🎨',location:'Berging',date:'2026-04-10',notes:'Flexa - Misty Green',reminder:'2027-04-10'}
 ],shopping:['Filter wasmachine','Lamp E27','Verf Flexa - Misty Green','Koffiebonen','Batterijen AA'],savedLists:[],shared:[]};

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function shell(content){
 document.body.classList.toggle('dark',state.dark);
 document.getElementById('root').innerHTML=`<div class="app">
 <header><div class="brand">🌿 Mijn Geheugen</div><button class="avatar" onclick="openProfile()">👤</button></header>
 <main>${content}</main>
 <button class="fab" onclick="openNew()">＋</button>
 <nav class="nav"><div class="navin">
 ${[['home','⌂','Home'],['list','☑','Lijst'],['reminders','♧','Herinneringen'],['share','♣','Delen'],['more','☰','Meer']].map(x=>`<button class="${state.tab==x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}<span>${x[2]}</span></button>`).join('')}
 </div></nav></div>`;
}
function go(t){state.tab=t;save();render()}
function render(){
 if(!state.logged){login();return}
 if(state.tab==='home')home(); else if(state.tab==='list')list(); else if(state.tab==='reminders')reminders(); else if(state.tab==='share')share(); else more();
}
function login(){
 document.getElementById('root').innerHTML=`<div class="login"><div class="loginbox"><div class="logo">🌿</div><h1>Mijn Geheugen</h1><p class="sub">Alles wat je wilt onthouden, op één plek.</p><div class="card">
 <div class="field"><label>E-mailadres</label><input id="email" value="${esc(state.user.email)}"></div>
 <div class="field"><label>Wachtwoord</label><input type="password" value="demo123"></div>
 <button class="primary" onclick="doLogin()">Inloggen</button>
 <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
 <button class="secondary" style="width:100%" onclick="doLogin()">🌐 Doorgaan met Google</button>
 </div><p class="muted">Demo-versie: gegevens worden lokaal op dit apparaat opgeslagen.</p></div></div>`;
}
function doLogin(){state.logged=true;state.user.email=document.getElementById('email').value||'jij@example.com';save();render();toast('Welkom terug!')}
function home(){
 let recent=state.items.slice(-3).reverse();
 shell(`<h1>Goedemorgen, ${esc(state.user.name)}!</h1><p class="sub">Je persoonlijke geheugen op één plek.</p>
 <div class="search">🔎 <input placeholder="Zoek naar een item..." oninput="searchItems(this.value)"></div>
 <h3>Categorieën</h3><div class="grid">${[['🏠','Huis'],['🚗','Auto'],['🧺','Apparaten'],['📄','Documenten'],['🛒','Aankopen'],['🏝️','Vakantie'],['🔧','Onderhoud'],['•••','Overig']].map(c=>`<button class="cat" onclick="filterCat('${c[1]}')"><span class="ico">${c[0]}</span><b>${c[1]}</b></button>`).join('')}</div>
 <h3>Recent</h3>${recent.map(itemCard).join('')}
 <div class="kpi"><div class="card"><div class="muted">Opgeslagen</div><div class="big">${state.items.length}</div><div class="tag">items</div></div><div class="card"><div class="muted">Boodschappen</div><div class="big">${state.shopping.length}</div><div class="tag">op je lijst</div></div></div>`);
}
function itemCard(i){return `<div class="card" onclick="detail(${i.id})"><div class="row"><div class="thumb">${i.icon}</div><div class="grow"><b>${esc(i.name)}</b><div class="muted">${esc(i.cat)} · ${esc(i.location)}</div></div><span>›</span></div></div>`}
function list(){
 shell(`<div class="top"><div><h1>Boodschappenlijst</h1><p class="sub">${state.shopping.length} items</p></div><button class="secondary" onclick="saveList()">Opslaan</button></div>
 <div class="card">${state.shopping.map((x,n)=>`<div class="item"><input class="check" type="checkbox" onchange="removeShop(${n})"><div class="grow">${esc(x)}</div><button onclick="state.shopping.splice(${n},1);save();list()">⋮</button></div>`).join('')||'<div class="empty">Je lijst is leeg.</div>'}</div>
 <button class="primary" onclick="addShopping()">＋ Product toevoegen</button>
 <h3>Opgeslagen lijsten</h3>${state.savedLists.map((x,n)=>`<div class="card"><div class="row"><span>📋</span><div class="grow"><b>${esc(x.name)}</b><div class="muted">${x.items.length} producten</div></div><button class="secondary" onclick="loadSaved(${n})">Laden</button></div></div>`).join('')||'<div class="empty">Nog geen opgeslagen lijsten.</div>'}`);
}
function addShopping(){let x=prompt('Product toevoegen:');if(x){state.shopping.push(x);save();list()}}
function removeShop(n){setTimeout(()=>{state.shopping.splice(n,1);save();list()},100)}
function saveList(){let n=prompt('Naam van deze lijst:', 'BBQ');if(n){state.savedLists.push({name:n,items:[...state.shopping]});save();list();toast('Lijst opgeslagen')}}
function loadSaved(n){state.shopping=[...state.savedLists[n].items];save();state.tab='list';render();toast('Lijst geladen')}
function reminders(){
 let r=[...state.items].sort((a,b)=>(a.reminder||'').localeCompare(b.reminder||''));
 shell(`<h1>Herinneringen</h1><p class="sub">Dingen die je niet wilt vergeten.</p>${r.map(i=>`<div class="card"><div class="row"><div class="thumb">${i.icon}</div><div class="grow"><b>${esc(i.name)}</b><div class="muted">Herinnering: ${esc(i.reminder||'Geen datum')}</div></div><span class="pill">${i.cat}</span></div></div>`).join('')}`);
}
function share(){
 shell(`<h1>Delen</h1><p class="sub">Werk samen met familie of huisgenoten.</p><div class="card" style="text-align:center"><div style="font-size:50px">👨‍👩‍👧‍👦</div><h2>Deel met je gezin</h2><p class="muted">In deze demo kun je deelnemers beheren.</p><button class="primary" onclick="invite()">＋ Deelnemer uitnodigen</button></div>
 <h3>Gedeeld met</h3>${state.shared.map((x,n)=>`<div class="card"><div class="row"><span>👤</span><div class="grow"><b>${esc(x)}</b><div class="muted">Kan bewerken</div></div><button onclick="state.shared.splice(${n},1);save();share()">×</button></div></div>`).join('')||'<div class="empty">Nog niemand toegevoegd.</div>'}`);
}
function invite(){let x=prompt('E-mailadres van deelnemer:');if(x){state.shared.push(x);save();share();toast('Uitnodiging toegevoegd')}}
function more(){
 shell(`<h1>Meer</h1><p class="sub">Instellingen en hulp.</p><div class="card menu">
 <button onclick="profilePage()"><span>👤</span><div><b>Mijn account</b><div class="muted">Profiel en accountgegevens</div></div></button>
 <button onclick="savedPage()"><span>📁</span><div><b>Opgeslagen</b><div class="muted">Je bewaarde items en lijsten</div></div></button>
 <button onclick="settings()"><span>⚙️</span><div><b>Instellingen</b><div class="muted">Thema en voorkeuren</div></div></button>
 <button onclick="help()"><span>❓</span><div><b>Help & uitleg</b><div class="muted">Zo werkt Mijn Geheugen</div></div></button>
 <button onclick="about()"><span>ℹ️</span><div><b>App-informatie</b><div class="muted">Over deze demo</div></div></button>
 <button onclick="logout()"><span>🚪</span><div><b>Uitloggen</b></div></button></div>`);
}
function profilePage(){simplePage('Mijn account',`<div class="card"><h2>${esc(state.user.name)}</h2><p class="muted">${esc(state.user.email)}</p><button class="secondary" onclick="rename()">Naam wijzigen</button></div><div class="card"><b>Gegevens</b><p class="muted">In deze demo staan je gegevens lokaal opgeslagen.</p><button class="secondary" onclick="toast('Alles is gesynchroniseerd')">Synchroniseren</button></div>`)}
function rename(){let n=prompt('Je naam:',state.user.name);if(n){state.user.name=n;save();profilePage()}}
function savedPage(){simplePage('Opgeslagen',`<div class="card"><h3>Items</h3>${state.items.map(itemCard).join('')}</div><div class="card"><h3>Opgeslagen boodschappenlijsten</h3>${state.savedLists.map((x,n)=>`<div class="item"><span>📋</span><div class="grow"><b>${esc(x.name)}</b><div class="muted">${x.items.length} producten</div></div><button class="secondary" onclick="state.shopping=[...state.savedLists[${n}].items];save();go('list')">Laden</button></div>`).join('')||'<p class="muted">Geen lijsten opgeslagen.</p>'}</div>`)}
function settings(){simplePage('Instellingen',`<div class="card"><div class="row"><div class="grow"><b>Donkere modus</b><div class="muted">Pas het uiterlijk aan</div></div><button class="secondary" onclick="state.dark=!state.dark;save();settings()">${state.dark?'Aan':'Uit'}</button></div></div><div class="card"><b>Meldingen</b><p class="muted">Herinneringen en updates.</p><button class="secondary" onclick="toast('Meldingen ingesteld')">Instellen</button></div>`)}
function help(){simplePage('Help & uitleg',`<div class="card"><h3>Een item toevoegen</h3><p class="muted">Tik op de groene plusknop en vul naam, categorie, locatie en eventuele herinnering in.</p></div><div class="card"><h3>Boodschappen</h3><p class="muted">Gebruik Lijst om boodschappen toe te voegen, af te vinken en lijsten op te slaan.</p></div><div class="card"><h3>Delen</h3><p class="muted">Via Delen kun je in een echte versie familieleden uitnodigen.</p></div>`)}
function about(){simplePage('App-informatie',`<div class="card"><div style="font-size:50px">🌿</div><h2>Mijn Geheugen</h2><p>Alles wat je wilt onthouden, op één plek.</p><p class="muted">Prototype 1.0 · © 2026 Mijn Geheugen</p></div><div class="card"><h3>Wat kun je ermee?</h3><p class="muted">Spullen bewaren, documenten koppelen, herinneringen plannen, boodschappen beheren en delen met je gezin.</p></div>`)}
function simplePage(title,html){shell(`<div class="top"><button class="secondary" onclick="more()">‹ Terug</button></div><h1>${title}</h1>${html}`)}
function openNew(){document.getElementById('root').insertAdjacentHTML('beforeend',`<div class="modal show" id="newModal"><div class="sheet"><div class="top"><h2>Nieuw item</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Naam</label><input id="nName" placeholder="Bijv. Wasmachine"></div><div class="field"><label>Categorie</label><select id="nCat"><option>Huis</option><option>Auto</option><option>Apparaten</option><option>Documenten</option><option>Aankopen</option><option>Vakantie</option><option>Onderhoud</option><option>Overig</option></select></div><div class="field"><label>Locatie</label><input id="nLoc" placeholder="Bijv. Keuken"></div><div class="field"><label>Herinnering</label><input id="nRem" type="date"></div><div class="field"><label>Notities</label><textarea id="nNotes" rows="4"></textarea></div><button class="primary" onclick="createItem()">Opslaan</button></div></div>`)}
function closeModal(){document.getElementById('newModal')?.remove()}
function createItem(){let name=document.getElementById('nName').value.trim();if(!name)return toast('Vul een naam in');let cat=document.getElementById('nCat').value;let icons={Huis:'🏠',Auto:'🚗',Apparaten:'🧺',Documenten:'📄',Aankopen:'🛒',Vakantie:'🏝️',Onderhoud:'🔧',Overig:'📦'};state.items.push({id:Date.now(),name,cat,icon:icons[cat],location:document.getElementById('nLoc').value,notes:document.getElementById('nNotes').value,reminder:document.getElementById('nRem').value});save();closeModal();render();toast('Item opgeslagen')}
function detail(id){let i=state.items.find(x=>x.id===id);simplePage(i.name,`<div class="card"><div style="font-size:65px">${i.icon}</div><h2>${esc(i.name)}</h2><p class="muted">${esc(i.cat)} · ${esc(i.location)}</p><hr style="border:0;border-top:1px solid var(--line)"><p><b>Herinnering:</b> ${esc(i.reminder||'Geen')}</p><p><b>Notities:</b><br>${esc(i.notes||'Geen notities')}</p><button class="secondary" onclick="state.shopping.push('${esc(i.name)}');save();toast('Toegevoegd aan boodschappen')">🛒 Op boodschappenlijst</button></div>`)}
function filterCat(c){let a=state.items.filter(i=>i.cat===c);simplePage(c,a.map(itemCard).join('')||'<div class="empty">Nog niets opgeslagen in deze categorie.</div>')}
function searchItems(q){/* demo hook; search is intentionally lightweight */}
function openProfile(){profilePage()}
function logout(){state.logged=false;save();render()}
render();
</script>
</body>
</html>
