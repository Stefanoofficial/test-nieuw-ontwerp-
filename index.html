<!DOCTYPE html>
<html lang="nl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boodschappenlijst & Slimme Maaltijdplanner</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            }
          }
        }
      }
    }
  </script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-full font-sans transition-colors duration-200" 
      x-data="groceryApp()" 
      x-init="initApp()" 
      :class="darkMode ? 'dark' : ''">

  <div class="max-w-3xl mx-auto px-4 py-6">
    
    <!-- Header -->
    <header class="flex justify-between items-center mb-4 bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700">
      <div class="flex items-center space-x-3">
        <div class="bg-brand-500 text-white p-2.5 rounded-lg shadow-sm">
          <i class="fa-solid fa-basket-shopping text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Familie Boodschappen</h1>
          <p class="text-xs text-gray-500 dark:text-gray-400">Slim, samen & georganiseerd</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-2">
        <button @click="darkMode = !darkMode" class="p-2.5 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors" title="Thema wisselen">
          <i class="fa-solid" :class="darkMode ? 'fa-sun text-amber-400' : 'fa-moon'"></i>
        </button>
      </div>
    </header>

    <!-- Producten Teller Statistieken -->
    <div class="grid grid-cols-3 gap-3 mb-4">
      <div class="bg-white dark:bg-gray-800 p-3 rounded-xl border border-gray-100 dark:border-gray-700 text-center shadow-sm">
        <span class="block text-2xl font-extrabold text-brand-600 dark:text-brand-500" x-text="items.length">0</span>
        <span class="text-[11px] font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Totaal Items</span>
      </div>
      <div class="bg-white dark:bg-gray-800 p-3 rounded-xl border border-gray-100 dark:border-gray-700 text-center shadow-sm">
        <span class="block text-2xl font-extrabold text-amber-500" x-text="activeItems.length">0</span>
        <span class="text-[11px] font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Nog Kopen</span>
      </div>
      <div class="bg-white dark:bg-gray-800 p-3 rounded-xl border border-gray-100 dark:border-gray-700 text-center shadow-sm">
        <span class="block text-2xl font-extrabold text-green-500" x-text="completedItems.length">0</span>
        <span class="text-[11px] font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">In Mandje</span>
      </div>
    </div>

    <!-- Gezinslid Filter Tabs -->
    <div class="flex items-center space-x-2 overflow-x-auto pb-2 mb-4 scrollbar-none">
      <button @click="selectedFilterMember = 'ALL'" 
              :class="selectedFilterMember === 'ALL' ? 'bg-brand-600 text-white font-medium shadow-sm' : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700'"
              class="px-3.5 py-1.5 rounded-full text-sm whitespace-nowrap transition-all border border-transparent dark:border-gray-700">
        <i class="fa-solid fa-users mr-1.5 opacity-75 text-xs"></i> Allen
      </button>
      <template x-for="member in familyMembers" :key="member.id">
        <button @click="selectedFilterMember = member.name" 
                :class="selectedFilterMember === member.name ? 'bg-brand-600 text-white font-medium shadow-sm' : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700'"
                class="px-3.5 py-1.5 rounded-full text-sm whitespace-nowrap transition-all flex items-center space-x-1.5 border border-transparent dark:border-gray-700">
          <span class="w-2 h-2 rounded-full" :style="{ backgroundColor: member.color }"></span>
          <span x-text="member.name"></span>
        </button>
      </template>
    </div>

    <!-- AI Recept / Slimme tekst invoer -->
    <div class="mb-4">
      <button @click="showAiInput = !showAiInput" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white p-3 rounded-xl shadow-md flex items-center justify-between font-medium transition-all">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-wand-magic-sparkles text-amber-300"></i>
          <span>Recept of tekst omzetten met AI</span>
        </div>
        <i class="fa-solid text-xs" :class="showAiInput ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
      </button>

      <div x-show="showAiInput" x-collapse x-cloak class="mt-2 p-4 bg-white dark:bg-gray-800 rounded-xl border border-purple-100 dark:border-purple-900 shadow-lg">
        <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Plak hier een recept of maaltijdidee:</label>
        <textarea x-model="aiPrompt" rows="3" placeholder="Bijv: Spaanse paella met kip, garnalen, erwten en saffraan..." class="w-full p-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-sm focus:ring-2 focus:ring-purple-500 focus:outline-none mb-2"></textarea>
        
        <div class="flex justify-between items-center">
          <div class="flex items-center space-x-2">
            <label class="text-xs text-gray-500 dark:text-gray-400">Toewijzen aan:</label>
            <select x-model="aiAssignee" class="text-xs p-1.5 rounded border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900">
              <template x-for="member in familyMembers" :key="member.id">
                <option :value="member.name" x-text="member.name"></option>
              </template>
            </select>
          </div>
          <button @click="processAiPrompt()" :disabled="aiLoading || !aiPrompt.trim()" class="bg-purple-600 hover:bg-purple-700 text-white text-xs px-4 py-2 rounded-lg font-medium flex items-center space-x-1.5 disabled:opacity-50 transition-colors">
            <template x-if="!aiLoading">
              <span class="flex items-center space-x-1">
                <i class="fa-solid fa-bolt"></i>
                <span>Voeg toe aan lijst</span>
              </span>
            </template>
            <template x-if="aiLoading">
              <span class="flex items-center space-x-1">
                <i class="fa-solid fa-spinner animate-spin"></i>
                <span>Verwerken...</span>
              </span>
            </template>
          </button>
        </div>
      </div>
    </div>

    <!-- Handmatige Toevoegen Form -->
    <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 mb-6 relative">
      <form @submit.prevent="addItem()" class="space-y-3">
        <div class="relative">
          <input type="text" 
                 x-model="newItemName" 
                 @input="handleInputAutocomplete()" 
                 @keydown.escape="showSuggestions = false"
                 placeholder="Wat heb je nodig? (bijv. Melk, Bananen...)" 
                 class="w-full pl-4 pr-10 py-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 focus:ring-2 focus:ring-brand-500 focus:outline-none text-base"
                 required>
          
          <div x-show="showSuggestions && suggestions.length > 0" 
               @click.outside="showSuggestions = false"
               x-cloak
               class="absolute z-20 left-0 right-0 top-full mt-1 bg-white dark:bg-gray-800 rounded-xl shadow-xl border border-gray-200 dark:border-gray-700 overflow-hidden">
            <template x-for="item in suggestions" :key="item.name">
              <button type="button" 
                      @click="selectSuggestion(item)"
                      class="w-full px-4 py-2.5 text-left hover:bg-gray-100 dark:hover:bg-gray-700 flex justify-between items-center text-sm border-b border-gray-50 dark:border-gray-700/50 last:border-0">
                <span class="font-medium" x-text="item.name"></span>
                <span class="text-xs px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-400" x-text="item.category"></span>
              </button>
            </template>
          </div>
        </div>

        <div class="flex flex-wrap gap-2 items-center justify-between">
          <div class="flex items-center space-x-2">
            <select x-model="newItemCategory" class="text-xs p-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-700 dark:text-gray-300">
              <template x-for="cat in categories" :key="cat">
                <option :value="cat" x-text="cat"></option>
              </template>
            </select>

            <select x-model="newItemAssignee" class="text-xs p-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-700 dark:text-gray-300">
              <template x-for="member in familyMembers" :key="member.id">
                <option :value="member.name" x-text="'Voor ' + member.name"></option>
              </template>
            </select>
          </div>

          <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white px-5 py-2.5 rounded-lg text-sm font-semibold shadow-sm transition-colors flex items-center space-x-1.5 ml-auto">
            <i class="fa-solid fa-plus"></i>
            <span>Toevoegen</span>
          </button>
        </div>
      </form>
    </div>

    <!-- Boodschappenlijst Secties -->
    <div class="space-y-6">
      
      <!-- Te Kopen Items -->
      <div>
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-sm font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Te Kopen Boodschappen</h2>
          <span class="text-xs font-semibold px-2.5 py-1 bg-brand-100 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300 rounded-full" x-text="activeItems.length + ' artikelen'"></span>
        </div>

        <template x-if="activeItems.length === 0">
          <div class="bg-white dark:bg-gray-800 rounded-xl p-8 text-center border border-dashed border-gray-200 dark:border-gray-700">
            <i class="fa-solid fa-circle-check text-4xl text-brand-500 mb-2 opacity-80"></i>
            <p class="text-gray-500 dark:text-gray-400 font-medium">De lijst is helemaal leeg!</p>
            <p class="text-xs text-gray-400 dark:text-gray-500 mt-1">Voeg hierboven snel items toe of gebruik de AI planner.</p>
          </div>
        </template>

        <!-- Categorie Groepen met Aantal per Categorie -->
        <div class="space-y-4">
          <template x-for="category in activeCategories" :key="category">
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
              <div class="bg-gray-50/50 dark:bg-gray-700/30 px-4 py-2 border-b border-gray-100 dark:border-gray-700/50 text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider flex justify-between items-center">
                <span x-text="category"></span>
                <span class="bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-2 py-0.5 rounded-full text-[10px]" x-text="getItemsByCategory(category).length"></span>
              </div>
              
              <ul class="divide-y divide-gray-100 dark:divide-gray-700/50">
                <template x-for="item in getItemsByCategory(category)" :key="item.id">
                  <li class="p-3.5 flex items-center justify-between hover:bg-gray-50/80 dark:hover:bg-gray-750 transition-colors group">
                    <div class="flex items-center space-x-3 flex-grow">
                      <button @click="toggleItem(item)" class="text-gray-300 dark:text-gray-600 hover:text-brand-500 dark:hover:text-brand-400 text-xl transition-colors">
                        <i class="fa-regular fa-circle"></i>
                      </button>
                      
                      <div class="flex flex-col">
                        <span class="font-medium text-gray-800 dark:text-gray-200" x-text="item.name"></span>
                        <div class="flex items-center space-x-2 mt-0.5">
                          <span class="text-[10px] px-2 py-0.5 rounded-full text-white font-medium" 
                                :style="{ backgroundColor: getMemberColor(item.assignedTo) }" 
                                x-text="item.assignedTo"></span>
                        </div>
                      </div>
                    </div>

                    <button @click="deleteItem(item.id)" class="text-gray-400 hover:text-red-500 p-1.5 opacity-0 group-hover:opacity-100 transition-opacity">
                      <i class="fa-solid fa-trash-can text-sm"></i>
                    </button>
                  </li>
                </template>
              </ul>
            </div>
          </template>
        </div>
      </div>

      <!-- Afgevinkte Items -->
      <div x-show="completedItems.length > 0">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400 dark:text-gray-500">In Winkelmandje (<span x-text="completedItems.length"></span>)</h2>
          <button @click="clearCompleted()" class="text-xs text-red-500 hover:underline">Wis afgevinkt</button>
        </div>

        <div class="bg-white/60 dark:bg-gray-800/60 rounded-xl border border-gray-100 dark:border-gray-700/50 overflow-hidden">
          <ul class="divide-y divide-gray-100 dark:divide-gray-700/30">
            <template x-for="item in completedItems" :key="item.id">
              <li class="p-3 flex items-center justify-between opacity-60">
                <div class="flex items-center space-x-3">
                  <button @click="toggleItem(item)" class="text-brand-500 text-xl">
                    <i class="fa-solid fa-circle-check"></i>
                  </button>
                  <span class="line-through text-gray-500 dark:text-gray-400 text-sm" x-text="item.name"></span>
                </div>
                <button @click="deleteItem(item.id)" class="text-gray-400 hover:text-red-500 p-1">
                  <i class="fa-solid fa-xmark"></i>
                </button>
              </li>
            </template>
          </ul>
        </div>
      </div>

    </div>
  </div>

  <script>
    function groceryApp() {
      return {
        darkMode: false,
        newItemName: '',
        newItemCategory: 'Overig',
        newItemAssignee: 'Papa',
        selectedFilterMember: 'ALL',
        showSuggestions: false,
        suggestions: [],
        showAiInput: false,
        aiPrompt: '',
        aiAssignee: 'Papa',
        aiLoading: false,

        familyMembers: [
          { id: '1', name: 'Papa', color: '#2563eb' },
          { id: '2', name: 'Mama', color: '#ec4899' },
          { id: '3', name: 'Sanne', color: '#8b5cf6' },
          { id: '4', name: 'Lucas', color: '#f59e0b' }
        ],

        categories: ['Groente & Fruit', 'Zuivel & Eieren', 'Bakkerij', 'Vlees & Vis', 'Voorraadkast', 'Diepvries', 'Dranken', 'Huishouden', 'Overig'],

        presetDatabase: [
          { name: 'Melk', category: 'Zuivel & Eieren' },
          { name: 'Karringmelk', category: 'Zuivel & Eieren' },
          { name: 'Goudse Kaas', category: 'Zuivel & Eieren' },
          { name: 'Eieren (10 stuks)', category: 'Zuivel & Eieren' },
          { name: 'Bananen', category: 'Groente & Fruit' },
          { name: 'Appels (Elstar)', category: 'Groente & Fruit' },
          { name: 'Komkommer', category: 'Groente & Fruit' },
          { name: 'Tomaat', category: 'Groente & Fruit' },
          { name: 'Brood (Volkoren)', category: 'Bakkerij' },
          { name: 'Afbakbroodjes', category: 'Bakkerij' },
          { name: 'Kipfilet', category: 'Vlees & Vis' },
          { name: 'Gehakt (Rund)', category: 'Vlees & Vis' },
          { name: 'Pasta (Penne)', category: 'Voorraadkast' },
          { name: 'Rijst (Basmati)', category: 'Voorraadkast' },
          { name: 'Toiletpapier', category: 'Huishouden' }
        ],

        items: [],

        initApp() {
          const localData = localStorage.getItem('boodschappen_items');
          if (localData) {
            this.items = JSON.parse(localData);
          } else {
            this.items = [
              { id: '1', name: 'Halfvolle Melk', category: 'Zuivel & Eieren', completed: false, assignedTo: 'Papa' },
              { id: '2', name: 'Bananen', category: 'Groente & Fruit', completed: false, assignedTo: 'Mama' },
              { id: '3', name: 'Volkoren Brood', category: 'Bakkerij', completed: true, assignedTo: 'Sanne' }
            ];
            this.saveItems();
          }
        },

        saveItems() {
          localStorage.setItem('boodschappen_items', JSON.stringify(this.items));
        },

        get filteredItems() {
          if (this.selectedFilterMember === 'ALL') {
            return this.items;
          }
          return this.items.filter(item => item.assignedTo === this.selectedFilterMember);
        },

        get activeItems() {
          return this.filteredItems.filter(item => !item.completed);
        },

        get completedItems() {
          return this.filteredItems.filter(item => item.completed);
        },

        get activeCategories() {
          const cats = this.activeItems.map(item => item.category);
          return [...new Set(cats)];
        },

        getItemsByCategory(category) {
          return this.activeItems.filter(item => item.category === category);
        },

        getMemberColor(name) {
          const member = this.familyMembers.find(m => m.name === name);
          return member ? member.color : '#6b7280';
        },

        handleInputAutocomplete() {
          const val = this.newItemName.trim().toLowerCase();
          if (val.length < 2) {
            this.suggestions = [];
            this.showSuggestions = false;
            return;
          }

          this.suggestions = this.presetDatabase.filter(item => 
            item.name.toLowerCase().includes(val)
          );
          this.showSuggestions = this.suggestions.length > 0;
        },

        selectSuggestion(item) {
          this.newItemName = item.name;
          this.newItemCategory = item.category;
          this.showSuggestions = false;
        },

        addItem() {
          if (!this.newItemName.trim()) return;

          this.items.push({
            id: Date.now().toString(),
            name: this.newItemName.trim(),
            category: this.newItemCategory,
            completed: false,
            assignedTo: this.newItemAssignee
          });

          this.newItemName = '';
          this.saveItems();
        },

        toggleItem(item) {
          item.completed = !item.completed;
          this.saveItems();
        },

        deleteItem(id) {
          this.items = this.items.filter(item => item.id !== id);
          this.saveItems();
        },

        clearCompleted() {
          this.items = this.items.filter(item => !item.completed);
          this.saveItems();
        },

        async processAiPrompt() {
          if (!this.aiPrompt.trim()) return;
          
          this.aiLoading = true;
          try {
            const apiKey = "";
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{
                  parts: [{
                    text: `Analyseer de volgende tekst/recept en geef een JSON-lijst terug van boodschappen. 
                    Gebruik exact dit JSON-formaat:
                    [
                      {"name": "Productnaam", "category": "Kies uit: Groente & Fruit, Zuivel & Eieren, Bakkerij, Vlees & Vis, Voorraadkast, Diepvries, Dranken, Huishouden, Overig"}
                    ]
                    
                    Tekst om te analyseren: "${this.aiPrompt}"`
                  }]
                }],
                generationConfig: {
                  responseMimeType: "application/json"
                }
              })
            });

            const data = await response.json();
            const textResponse = data.candidates[0].content.parts[0].text;
            const parsedItems = JSON.parse(textResponse);

            if (Array.isArray(parsedItems)) {
              parsedItems.forEach(i => {
                this.items.push({
                  id: Date.now().toString() + Math.random(),
                  name: i.name,
                  category: this.categories.includes(i.category) ? i.category : 'Overig',
                  completed: false,
                  assignedTo: this.aiAssignee
                });
              });
              this.saveItems();
              this.aiPrompt = '';
              this.showAiInput = false;
            }
          } catch (e) {
            console.error("AI Fout:", e);
            alert("Er is iets misgegaan bij het verwerken van de AI-aanvraag.");
          } finally {
            this.aiLoading = false;
          }
        }
      }
    }
  </script>
</body>
</html>
